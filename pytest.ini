[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header -rN
markers =
    api: tests that make real external API calls (RunwayML, OpenAI)
    integration: tests that require the server to be running on port 8000
    slow: tests that may take >30 seconds
    unit: fast pure-logic tests requiring no network
    e2e: full end-to-end pipeline tests covering all 9 stages (very slow, uses real credits)
